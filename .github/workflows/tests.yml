name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}

jobs:
  test:
    name: Full Test Suite on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `--all-features` is avoided on purpose: it would enable `runtime-linking`, so the test
      # binaries would have to load `libaic` at runtime before any SDK call. The dynamic and
      # runtime linking modes are exercised separately in linking.yml.
      - name: Run Tests
        run: |
          cargo test --workspace --locked --features "async download-lib download-model" -- --nocapture
